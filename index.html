        #matrix-dashboard {
            position: absolute; top: 38px; left: 38px; z-index: 10; pointer-events: none;
            width: 380px; padding-left: 20px; border-left: 3px solid rgba(255, 112, 32, 0.9);

        .s-lamp:nth-child(1).lamp-on { background: #ff3344; box-shadow: 0 0 16px #ff3344; border-color: #ff3344; opacity: 1; transform: scale(1.15);}
        .s-lamp:nth-child(2).lamp-on { background: #00ff73; box-shadow: 0 0 16px #00ff73; border-color: #00ff73; opacity: 1; transform: scale(1.15);}
        .s-lamp:nth-child(3).lamp-on { background: #1a8cff; box-shadow: 0 0 16px #1a8cff; border-color: #1a8cff; opacity: 1; transform: scale(1.15);}

        .glass-btn.active-mode { color: #1edb82; border-color: rgba(30, 219, 130, 0.4);}

        // ====== IV. 高阶几何星变大迁徙定位阵坐标系统 ！(用于切换算各种极复杂的数学图形向指坐标地!)。=========---
        function CallCalculationSysToWriteDestinyMorphPointsByGivenTypeKeyNumStateGenValLogicCallerFunDoRPointCArrayMArrayCall( graphIDStateModeSelectCodeTypeDataToLoadOKeyOValVIdRefKeyVarIIdxVCallT ){
            for(let iterIDIndexCurrentCount=0; iterIDIndexCurrentCount<MAX_TOTAL_NODES; iterIDIndexCurrentCount++) {
                let ArrIndexPTRXMemOfOffsetOffsetMathSArrayLocationAThisHValueInDPosToG1ThisCallMRefCIndexByNumMult = iterIDIndexCurrentCount * 3;
                let nx, ny, nz; let nCArrHoldTofColRG={r: 1, g:1, b:1};

                if (graphIDStateModeSelectCodeTypeDataToLoadOKeyOValVIdRefKeyVarIIdxVCallT === 0 ) { 
                    // [ 球中珠 : Mandala系统 (分橙核外青罩!)] 
                    let insideRingGroupYesTypeRTheRadRefGroupYesOrIfObjPNoConditionSysRefOfNumIs= (iterIDIndexCurrentCount % 2 === 0);
                    let MRBaseSphereTypeGenVForRadDistN = insideRingGroupYesTypeRTheRadRefGroupYesOrIfObjPNoConditionSysRefOfNumIs ? 45 : 98 + (Math.random()*6-3); 
                    let Phi3DCircAValuePhiForGDataCosROVarBMathCosOp = Math.acos( -1 + (2*Math.random()) ); 
                    let ThetaRadArgGAndCosTypeAARandomVStoreFThereS2TheP= Math.random()* Math.PI*2; 
                    nx = MRBaseSphereTypeGenVForRadDistN * Math.sin(Phi3DCircAValuePhiForGDataCosROVarBMathCosOp)*Math.cos(ThetaRadArgGAndCosTypeAARandomVStoreFThereS2TheP);
                    ny = MRBaseSphereTypeGenVForRadDistN * Math.sin(Phi3DCircAValuePhiForGDataCosROVarBMathCosOp)*Math.sin(ThetaRadArgGAndCosTypeAARandomVStoreFThereS2TheP); 
                    nz = MRBaseSphereTypeGenVForRadDistN * Math.cos(Phi3DCircAValuePhiForGDataCosROVarBMathCosOp); 
                    nCArrHoldTofColRG= insideRingGroupYesTypeRTheRadRefGroupYesOrIfObjPNoConditionSysRefOfNumIs ? {r:0.95, g:0.75, b:0.25} : {r:0.8, g:0.42, b:0.95};
                }
                else if (graphIDStateModeSelectCodeTypeDataToLoadOKeyOValVIdRefKeyVarIIdxVCallT === 1) { 
                    // [ 量簇晶群方天结结 - Gyroid方! )] (以翠与青金色方系为底！)]! 
                    let cubeBaseLimitAreaScaleDFromOFloatTThisA= 60 * Math.pow(Math.random(), 0.7);
                    nx = (Math.random() - 0.5) * cubeBaseLimitAreaScaleDFromOFloatTThisA * 2.2 ;

                    let TKtArTheTypeBaseFloatValGPhiTForXForGCallRMathA = (iterIDIndexCurrentCount/MAX_TOTAL_NODES) * Math.PI*2.0;

                    nx = RadiusT_TreVAlSFloatScaleRadMathFloatTypeOfStoreRValGObjBInRef1P20 * ( Math.sin(TKtArTheTypeBaseFloatValGPhiTForXForGCallRMathA)+ 2*Math.sin(2*TKtArTheTypeBaseFloatValGPhiTForXForGCallRMathA) ) + (Math.random()-0.5)*7.5;

                    nz = -RadiusT_TreVAlSFloatScaleRadMathFloatTypeOfStoreRValGObjBInRef1P20 * 1.3* Math.sin(3*TKtArTheTypeBaseFloatValGPhiTForXForGCallRMathA) + (Math.random()-0.5)*7.5;

        // ====== ★★★ V. 量子柔和波推浪 (Smooth Gaussian Ripples Physics Array! 划时代的质感升级! !) ======! =  ============!!!!=======------========= :: -=======
        
        let PhysicsWaveArraySystemManagerMemoryObjectPushedListTheCacheListQueueAStoreCallAllStore=[]; // 可承装并发叠加海波多个的列装管水浪库波队列容器

        // ====== VI. 画出岁月引擎和数学时海钟大回走循环 ======= ====== -=== ========:: ---! ====::!!! ---- !!! === ====== =====-----==========!!!========-----
        let TheUniversePhysicsMatrixGlobalMasterEngineClcClockTickerTypeObject= new THREE.Clock();

        function TheInfiniteCycleGodMainAnimationSystemClockTriggerRunMethodHookOpMainRunLogicHookForC() {
             requestAnimationFrame(TheInfiniteCycleGodMainAnimationSystemClockTriggerRunMethodHookOpMainRunLogicHookForC);

             let theDTTimeElapasedToDiffGFloatBaseDeltaBForSysMThisOValSysMTimeRunDeltaG = Math.min(TheUniversePhysicsMatrixGlobalMasterEngineClcClockTickerTypeObject.getDelta(), 0.1);
